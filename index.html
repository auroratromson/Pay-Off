.pt{margin:4px 0 6px;white-space:pre-wrap;word-wrap:break-word}
.hash{color:var(--blue);margin-right:8px}

.prog.ok i{background:var(--green)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.st{font-size:.85rem;color:var(--mu);display:flex;align-items:center;gap:4px}
.st.ok{color:var(--green);font-weight:700}

.help:disabled{background:transparent;color:var(--green);border:1px solid var(--green);cursor:default}
.help svg{width:16px;height:16px;fill:currentColor;stroke:none}
.empty{padding:32px 16px;color:var(--mu)}
form{padding:16px}
.fl{display:block;margin:0 0 16px}
.fl>span{display:block;color:var(--mu);font-size:.85rem;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
select option{background:var(--bg);color:var(--tx)}
textarea{min-height:110px;resize:vertical}
.note{color:var(--mu);font-size:.85rem;margin:0 16px 12px}
.cr{text-align:center;color:var(--mu);font-size:.85rem;margin:24px 16px 0}
.cr a{color:var(--blue);text-decoration:none}
.cr a:hover{text-decoration:underline}

.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

dialog::backdrop{background:rgba(91,112,131,.45)}
dialog h2{font-size:1.2rem;margin:0 0 4px}
dialog .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.quick{display:flex;gap:6px;margin:10px 0}
.quick button{flex:1;border:1px solid var(--bd);border-radius:99px;padding:7px 4px;font-weight:700}
.quick button:hover{background:var(--hv)}
.ghost{border:1px solid var(--bd);border-radius:99px;padding:7px 16px;font-weight:700}
.meta{color:var(--mu)}
.hide{display:none}
.shbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-top:8px;border:1px solid var(--bd);border-radius:12px;font-weight:700;text-align:left}
.shbtn:hover{background:var(--hv)}
.shbtn.rec{border-color:var(--blue);color:var(--blue)}
.shbtn svg{width:20px;height:20px;flex:none}
.ck{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:500}
.ck input{width:20px;height:20px;padding:0;accent-color:var(--blue)}
.act{display:flex;align-items:center;gap:6px}

.ico-btn:hover{background:var(--hv);color:var(--blue)}

.side,.rail{display:none}

.nbtn:hover{background:var(--hv)}

function ago(m){return m<1?t("now"):m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d"}
var CHECK='<svg class="vf" viewBox="0 0 24 24" aria-label="verified"><path d="M22.5 12.5l-2.4-2.7.3-3.6-3.5-.8-1.9-3.1L12 3.7 8.6 2.3 6.7 5.4l-3.5.8.3 3.6L1.1 12.5l2.4 2.7-.3 3.6 3.5.8 1.9 3.1L12 21.3l3.4 1.4 1.9-3.1 3.5-.8-.3-3.6zM10.6 16.6l-3.4-3.4 1.4-1.4 2 2 4.8-4.8 1.4 1.4z"/></svg>';
var HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.6 5 6 5c2 0 3.3 1.1 4 2.2h4C14.7 6.1 16 5 18 5c3.4 0 5.1 3.6 3.6 6.9C19.5 16.4 12 21 12 21z"/></svg>';

var SHARE_URL=""; /* Pon aquí la dirección web de tu app, p. ej. https://saldar.app */
var SHARE='<svg class="ico" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>';
function debtById(id){return debts.filter(function(d){return d.id===id})[0]}
function shareUrl(d){var b=SHARE_URL||(/^https?:/.test(location.href)?location.href.split("#")[0]:"");return b?b+"#d"+d.id:""}
function shareMsg(d){
  var left=d.amt-d.paid,a=L(d.alias),c=t("cats")[d.cat];
  if(left<=0)return lang==="en"?a+" settled a debt thanks to people like you. #Saldar":a+" ha saldado una deuda gracias a la gente. #Saldar";
  return lang==="en"?a+" needs help with a debt: "+eur(left)+" to go ("+c+"). Can you lend a hand? #Saldar":a+" necesita ayuda con una deuda: faltan "+eur(left)+" ("+c+"). ¿Echas una mano? #Saldar";
}
function openExt(u){
  try{if(window.Android&&Android.openUrl){Android.openUrl(u);return}}catch(e){}
  window.open(u,"_blank","noopener");
}
function copyText(x,msg){
  function fb(){var a=document.createElement("textarea");a.value=x;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();toast(msg)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(x).then(function(){toast(msg)},fb)}else fb();
}
function shareX(d){var u=shareUrl(d);openExt("https://x.com/intent/post?text="+encodeURIComponent(shareMsg(d))+(u?"&url="+encodeURIComponent(u):""))}
function shareNative(d){
  var u=shareUrl(d),o={text:shareMsg(d)};if(u)o.url=u;
  try{if(window.Android&&Android.share){Android.share(shareMsg(d)+(u?" "+u:""));return true}}catch(e){}
  if(navigator.share){navigator.share(o).catch(function(){});return true}
  return false;
}
function shareIG(d){
  if(shareNative(d))return;
  var u=shareUrl(d);copyText(shareMsg(d)+(u?" "+u:""),t("igCopied"));
  setTimeout(function(){openExt("https://www.instagram.com/")},900);
}
function openShare(id,pre){
  var d=debtById(id),h="";
  $("#s-title").textContent=pre?t("shPub"):t("shT");
  $("#s-sub").textContent=t("shSub");
  if(!pre||pre.x)h+='<button class="shbtn rec" data-a="x">'+SHARE+t("shX")+'</button>';
  if(!pre||pre.ig)h+='<button class="shbtn rec" data-a="ig">'+SHARE+t("shIG")+'</button>';
  h+='<button class="shbtn" data-a="cp">'+SHARE+t("shCopy")+'</button>';
  $("#s-btns").innerHTML=h;
  $("#s-btns").querySelectorAll("button").forEach(function(b){b.onclick=function(){
    var a=b.dataset.a;
    if(a==="x")shareX(d);
    else if(a==="ig")shareIG(d);
    else{var u=shareUrl(d);copyText(shareMsg(d)+(u?" "+u:""),t("copied"))}
  }});
  $("#sdlg").showModal();
}
$("#s-close").onclick=function(){$("#sdlg").close()};
/* Supabase (claves públicas; la seguridad la dan las reglas RLS de la base de datos) */
var SB_URL="https://ygxpjevdmxvypbhnrhir.supabase.co";
var SB_KEY="sb_publishable_peBRhjUQ51Iha-bRyjN1vg_r4CjuaHe";
var usingDemo=true;
function sb(path,opt){
  opt=opt||{};
  return fetch(SB_URL+"/rest/v1/"+path,{method:opt.method||"GET",body:opt.body,headers:{apikey:SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()});
}
function fromRow(r){
  return {id:r.id,ago:Math.max(0,Math.round((Date.now()-new Date(r.created_at))/60000)),alias:r.alias,cat:r.category,cred:r.creditor,
    amt:r.amount,paid:r.paid,ver:r.status==="verified",story:r.story};
}
function loadDebts(){
  sb("debts?select=*&order=created_at.desc").then(function(rows){
    if(rows.length){
      debts=rows.map(fromRow);usingDemo=false;
      nextId=Math.max.apply(null,debts.map(function(d){return d.id}))+1;
      renderList();
      if(/^#d\d+$/.test(location.hash)){var e1=document.getElementById(location.hash.slice(1));if(e1)e1.scrollIntoView()}
    }
  }).catch(function(){});
}
function setStat(sel,key,to,fmt){
  var el=$(sel), from=shown[key]; shown[key]=to;
  if(reduced||from===to){el.textContent=fmt(to);return}
  var st=performance.now();
  (function f(n){var k=Math.min(1,(n-st)/900);el.textContent=fmt(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(st);
}
function updateStats(){
  var tot=0,h=0;debts.forEach(function(d){tot+=d.paid;if(d.paid>0)h++});
  setStat("#s-total","t",tot,eur); setStat("#s-help","h",h,String);
}
function renderChips(){
  var all=["all"].concat(CATS);
  $("#chips").innerHTML=all.map(function(c){return '<button aria-pressed="'+(c===filter)+'" data-c="'+c+'">'+(c==="all"?t("all"):t("cats")[c])+'</button>'}).join("");
  $("#chips").querySelectorAll("button").forEach(function(b){b.onclick=function(){filter=b.dataset.c;renderChips();renderList()}});
}
function renderList(){
  updateStats();
  var items=debts.filter(function(d){return filter==="all"||d.cat===filter});
  if(!items.length){$("#list").innerHTML='<p class="empty">'+esc(t("empty"))+'</p>';return}
  $("#list").innerHTML=items.map(function(d){
    var left=d.amt-d.paid, pct=Math.round(d.paid/d.amt*100), done=left<=0, a=L(d.alias);
    return '<article class="post" id="d'+d.id+'"><div class="av" style="background:'+COL[d.cat]+'">'+esc(a.charAt(0).toUpperCase())+'</div><div class="pb">'+
      '<div class="ph"><b>'+esc(a)+'</b>'+(d.ver?CHECK:'')+'<span class="m">'+esc(handle(a))+' · '+ago(d.ago)+'</span></div>'+
      '<p class="pt">'+esc(L(d.story))+'</p>'+
      '<div><span class="hash">#'+esc(t("cats")[d.cat])+'</span></div>'+
      '<div class="owed">'+t("owedTo")+esc(L(d.cred))+'</div>'+
      '<div class="amt">'+eur(done?d.amt:left)+(done?'':' <small>'+t("of")+eur(d.amt)+'</small>')+'</div>'+
      '<div class="prog'+(done?' ok':'')+'" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+
      '<div class="foot"><span class="st'+(done?' ok':'')+'">'+(done?'✓ '+t("paid"):(d.ver?t("ver"):t("pend")))+'</span>'+
      '<div class="act"><button class="ico-btn" data-sh="'+d.id+'" aria-label="'+t("shT")+'">'+SHARE+'</button><button class="help" data-id="'+d.id+'"'+(done?' disabled':'')+'>'+(done?'':HEART)+(done?t("paid"):t("help"))+'</button></div></div></div></article>';
  }).join("");
  $("#list").querySelectorAll(".help[data-id]").forEach(function(b){b.onclick=function(){openDlg(+b.dataset.id)}});
  $("#list").querySelectorAll("[data-sh]").forEach(function(b){b.onclick=function(){openShare(+b.dataset.sh,null)}});
}
function renderCats(){
  var v=$("#f-cat").value||CATS[0];
  $("#f-cat").innerHTML=CATS.map(function(c){return '<option value="'+c+'">'+t("cats")[c]+'</option>'}).join("");
  $("#f-cat").value=v;
}
function applyLang(){
  document.documentElement.lang=lang; document.title=t("title");
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t(e.dataset.ph)});
  $("#back").setAttribute("aria-label",t("back")); $("#fab").setAttribute("aria-label",t("compose"));
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang)});
  if($("#dlg").open)$("#dlg").close();
  renderCats(); renderChips(); renderList();
}
document.querySelectorAll("[data-lang]").forEach(function(b){b.onclick=function(){lang=b.dataset.lang;applyLang()}});

var FEE=0.0025, SP=0.015, SF=25; /* comisión Saldar, % de Stripe y cuota fija (céntimos) */
function eur2(c){return (c/100).toLocaleString(lang==="en"?"en-GB":"es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"}
function bk(v){var d=Math.round(v*100),f=Math.round(d*FEE),n=d+f,tot=Math.ceil((n+SF)/(1-SP));return{debt:d,fee:f,proc:tot-n,total:tot}}
function renderBk(){
  var v=Math.floor(+$("#d-amt").value);
  if(!(v>=1)){$("#bk").innerHTML="";return}
  var b=bk(v),pct=(FEE*100).toLocaleString(lang==="en"?"en-GB":"es-ES",{maximumFractionDigits:2});
  $("#bk").innerHTML='<div><span>'+t("bkDebt")+'</span><span>'+eur2(b.debt)+'</span></div><div><span>'+t("bkFee")+' ('+pct+' %)</span><span>'+eur2(b.fee)+'</span></div><div><span>'+t("bkProc")+'</span><span>'+eur2(b.proc)+'</span></div><div class="tot"><span>'+t("bkTot")+'</span><span>'+eur2(b.total)+'</span></div>';
}
function openDlg(id){
  cur=debts.filter(function(d){return d.id===id})[0];
  var left=cur.amt-cur.paid;
  $("#d-title").textContent=t("dTitle")+L(cur.alias);
  $("#d-sub").textContent=t("dSub1")+eur(left)+t("dSub2")+L(cur.cred)+".";
  $("#d-amt").value=Math.min(50,left); $("#d-amt").max=left;
  var opts=[Math.min(25,left),Math.min(100,left),left].filter(function(v,i,a){return a.indexOf(v)===i});
  $("#quick").innerHTML=opts.map(function(v){return '<button type="button" data-v="'+v+'">'+(v===left?t("dAll"):'')+eur(v)+'</button>'}).join("");
  $("#quick").querySelectorAll("button").forEach(function(b){b.onclick=function(){$("#d-amt").value=b.dataset.v;renderBk()}});
  renderBk();
  $("#dlg").showModal();
}
$("#d-cancel").onclick=function(){$("#dlg").close()};
$("#d-amt").oninput=renderBk;
$("#d-ok").onclick=function(){
  var v=Math.floor(+$("#d-amt").value), left=cur.amt-cur.paid;
  if(!(v>=1)||v>left){$("#d-amt").focus();return}
  cur.paid+=v; $("#dlg").close(); renderList();
  toast(cur.paid>=cur.amt?t("tDone"):t("tPaid1")+eur2(bk(v).total)+t("tPaid2"));
};
function toast(m){
  var e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=m;
  document.body.appendChild(e);setTimeout(function(){e.remove()},2600);
}
$("#form").onsubmit=function(ev){
  ev.preventDefault();
  var row={alias:$("#f-alias").value.trim(),category:$("#f-cat").value,creditor:$("#f-cred").value.trim(),
    amount:Math.floor(+$("#f-amt").value),story:$("#f-story").value.trim(),lang:lang};
  var wx=$("#c-x").checked, wig=$("#c-ig").checked;
  sb("debts",{method:"POST",body:JSON.stringify([row])}).then(function(r){return fromRow(r[0])}).catch(function(){
    return {id:nextId++,ago:0,alias:row.alias,cat:row.category,cred:row.creditor,amt:row.amount,paid:0,ver:false,story:row.story,local:true};
  }).then(function(nd){
    if(usingDemo){debts=[];usingDemo=false}
    debts.unshift(nd);
    $("#form").reset(); filter="all"; renderChips(); renderList(); show("feed");
    toast(nd.local?t("tOff"):t("tPub"));
    if(wx||wig)openShare(nd.id,{x:wx,ig:wig});
  });
};
function show(w){
  view=w;
  $("#feed").classList.toggle("hide",w!=="feed"); $("#publish").classList.toggle("hide",w!=="publish");
  $("#h-feed").classList.toggle("hide",w!=="feed"); $("#h-pub").classList.toggle("hide",w!=="publish");
  $("#chips").classList.toggle("hide",w!=="feed"); $("#fab").classList.toggle("hide",w!=="feed");
  window.scrollTo(0,0);
}
$("#fab").onclick=function(){show("publish")}; $("#back").onclick=function(){show("feed")};
$("#s-pub").onclick=function(){show("publish")}; $("#s-home").onclick=function(){show("feed")};
applyLang();
if(/^#d\d+$/.test(location.hash)){var e0=document.getElementById(location.hash.slice(1));if(e0)e0.scrollIntoView()}
loadDebts();
</script>
</body>
